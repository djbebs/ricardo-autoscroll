name: Build Android APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Audit source
        run: |
          ! grep -R -E 'getRootInActiveWindow|getWindows\(|android.permission.INTERNET|canRetrieveWindowContent="true"' app/src/main
      - run: gradle assembleRelease lintRelease --no-daemon
      - name: Sign release and verify
        env:
          SIGNING_KEY: ${{ secrets.RICARDO_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.RICARDO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ] || [ -n "$SIGNING_PASSWORD" ]; then
            test -n "$SIGNING_KEY" && test -n "$SIGNING_PASSWORD" || exit 1
            printf %s "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            SIGNING_PASSWORD=changeit
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass changeit -keypass changeit -alias ricardo -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Ricardo AutoScroll Test"
          fi
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias ricardo --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --out RicardoAutoScroll-V3.0.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs RicardoAutoScroll-V3.0.apk
          "$BT/aapt" dump permissions RicardoAutoScroll-V3.0.apk
          sha256sum RicardoAutoScroll-V3.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RicardoAutoScroll-V3.0
          path: |
            RicardoAutoScroll-V3.0.apk
            SHA256SUMS.txt
          if-no-files-found: error
